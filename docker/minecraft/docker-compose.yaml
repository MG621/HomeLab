services:
  minecraft:
    image: itzg/minecraft-server:java17
    container_name: minecraft
    restart: unless-stopped

    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.19.4"
      MAX_MEMORY: 8G
      INIT_MEMORY: 2G
      MAX_TICK_TIME: 300000
      ONLINE_MODE: "TRUE"
      ENABLE_AUTOPAUSE: "TRUE"
      AUTOPAUSE_TIMEOUT_EST: "300"
      AUTOPAUSE_TIMEOUT_INIT: "600"
      AUTOPAUSE_PERIOD: "60"
      ENABLE_BACKUPS: "TRUE"
      BACKUP_INTERVAL: "30m"
      BACKUP_RETENTION: "10"
      BACKUP_METHOD: "tar"
      BACKUP_NAME: "world-%Y-%m-%d_%H-%M-%S"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"

    volumes:
      - ./data:/data
      - ./backups:/backups

    # VERY IMPORTANT:
    # Bind only to Tailscale interface
    ports:
      - "100.72.107.50:25565:25565"
    stdin_open: true
    tty: true
