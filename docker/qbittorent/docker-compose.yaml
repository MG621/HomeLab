services:
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - /home/mario-garza/docker/qbittorrent/config:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/movies:/movies
      - /mnt/media/tv_shows:/tv_shows
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

